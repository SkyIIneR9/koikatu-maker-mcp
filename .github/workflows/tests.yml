name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m compileall -q bridge_client.py server.py texture_assets.py package_source.py tests
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python package_source.py
